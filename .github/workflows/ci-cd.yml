name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - "feature/*"
      - "hotfix/*"

  pull_request:
    branches:
      - main
      - develop

jobs:
  build-test-security:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Perfulandia-Backend-Natalia

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Give execute permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Build and Test
        run: ./mvnw clean test

      - name: Build Docker image
        run: docker build -t perfulandia-backend .

      - name: Snyk Security Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          npm install -g snyk
          snyk test --severity-threshold=high

      - name: SonarQube Scan
        run: |
          ./mvnw sonar:sonar \
          -Dsonar.projectKey=Perfulandia-Backend-Natalia \
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      - name: Build Success
        run: echo "CI/CD ejecutado correctamente"
