name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - "feature/*"
      - "hotfix/*"

  pull_request:
    branches:
      - main
      - develop

jobs:
  build-test-security:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Perfulandia-Backend-Natalia

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      
      # JAVA SETUP
      
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Give execute permission to Maven Wrapper
        run: chmod +x mvnw

      
      # BUILD & TEST
      
      - name: Build and Test
        run: ./mvnw clean test

      
      # DOCKER BUILD
      
      - name: Build Docker image
        run: docker build -t perfulandia-backend .

      
      # NODE (para SNYK)
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Snyk
        run: npm install -g snyk

      - name: Snyk Security Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=critical


      # SONARQUBE ANALYSIS
      - name: SonarQube Scan
        run: |
          ./mvnw sonar:sonar \
          -Dsonar.projectKey=Perfulandia-Backend-Natalia \
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}


      # QUALITY GATE
      - name: SonarQube Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


      # SUCCESS
      - name: Build Success
        run: echo "CI/CD ejecutado correctamente"
